[pad]
enabled=1
; stick dead zone and the push (percent) below which the player walks
dead_zone_percent=25
walk_below_percent=60
; cursor ring around the player: walking (pixels), running (percent of the screen height)
walk_ring_pixels=60
run_ring_percent=30
; right stick cursor speed (pixels per frame at full push)
cursor_speed=14
; hide the mouse cursor while the left stick plays (1 on, 0 off; the right stick shows it again)
hide_cursor=1
; R3 + right stick zoom: hold R3 this long first (ms), then push the stick past this much (percent) up / down
zoom_hold_ms=250
zoom_dead_zone_percent=50
; R3 = left click where the cursor is after the right stick moved it (until the left stick is used again; 1 on, 0 off)
r3_click=1
; right stick cursor mode (in a game) starts only with the stick pushed past this (percent) for a moment; the cursor then starts on the player
cursor_start_percent=50
; lock-on: A and X / Y / B aim at the closest visible enemy in a cone in front of the player (1 on, 0 off)
lock_on=1
lock_on_range=400
; aim cone: the floor in the lock-on cone brightened: 0 off, 1 while the aim button (R1) is held, 2 always while the left stick plays (brighter with R1); strength in percent
aim_cone=1
aim_cone_strength=20
lock_on_cone_degrees=30
; while the pad is in use: its buttons on the HUD instead of keys (1 on, 0 off), short control hints (1 on, 0 off)
button_labels=1
hints=1
; game_joystick: 0 = only Nox Modernized reads the gamepad (default); 1 = the game also reads it through its own joystick support
;   (two readers of the same gamepad: buttons could act twice)
game_joystick=0

[inventory]
; keep_facing: the player keeps the facing he had when the inventory opened, while the cursor is on the inventory (a dropped item lands in front of him); 1 on, 0 off (turns towards the inventory)
keep_facing=1
; tabs above the inventory (L1 / R1): 1 on, 0 off
tabs=1
; item comparison next to the inventory: 1 on, 0 off
compare=1

; ---- gamepad buttons (easiest with NoxModernized-Settings.exe, Buttons page) ----
; action = combo[, combo]   e.g.  jump = lt   slot3 = b, l1_x   trap = none
; [shared] the same for every class: attack aim interact wheel inventory book menu
; [warrior] [wizard] [conjurer]: slot1 slot2 slot3 slot4 slot5 cast_recent jump health mana cure swap map
;          next_set prev_set trap quicksave taunt laugh point creatures (conjurer: creature order menu)
; Combos: a b x y lt rt r1 l3 r3 select start dpad_up dpad_down dpad_left dpad_right, and each with l1_ in front
;         (l1_x, l1_dpad_up...). One combo does one thing; a combo of a shared action is not used by a class.
; The game actions are sent as the key they have in the game's controls (nox.cfg). Always: L1 is the modifier,
; Select + Start the settings menu, hold R3 + right stick to zoom; menus keep A / B / Start / Select / D-pad.
; Unlisted actions keep their defaults:
;   shared:    attack=a aim=r1 interact=r3 wheel=l3 inventory=select book=l1_select menu=start
;   classes:   slot1=x slot2=y slot3=b,l1_x slot4=l1_y slot5=l1_b jump=lt quicksave=rt health=dpad_up
;              swap=dpad_down map=dpad_left next_set=dpad_right,l1_rt prev_set=l1_r1 mana=l1_dpad_up
;              cure=l1_dpad_down trap=l1_a (wizard, conjurer)
;   warrior:   no mana, spell sets or trap;  conjurer: creatures=dpad_right, next_set=l1_rt

[display]
; keep_screen_on: no screen saver or monitor power saving while the game is in front (Windows does not count a gamepad as activity; the screen saver froze the ending movie) (1 on, 0 off)
keep_screen_on=1
; renderer: d3d11 = our own (Direct3D 11, GDI if that fails) | gog = GOG's wrapper (ddraw_gog.dll)
renderer=d3d11
; mode: borderless = covers the whole monitor | window = a normal window
mode=borderless
; window size as a multiple of 640x480 (0 = the biggest that fits)
window_scale=0
; vsync: 1 on, 0 off
vsync=1
; scale: fit = as big as fits, shape kept | integer = whole multiples only (crisp, may leave a border) | stretch = fill the screen
scale=fit
; filter: nearest = raw pixels | sharp = pixels kept, edges blended (no shimmer at odd sizes) | linear = soft
;         bicubic = smooth and sharper than linear | lanczos = smoothest and sharpest, may ring slightly at hard edges
filter=sharp
; screenshot key (Windows key code): 44 = Print Screen, 123 = F12 (the game also saves its own on F12), 0 = off
screenshot_key=44
; resolution: the size used in the game (menus stay 640x480): e.g. 1280x720, 1920x1080 (default), 2560x1440, desktop; 1024x768 = the original
resolution=1920x1080
; frame counter in the top right corner: 1 shown at start, 0 hidden; fps_key toggles it (119 = F8)
fps=0
fps_key=119
; join_clamp: 1 = the game's server is told at most 1024x768 (needed above 1024 wide), 0 = the real size
join_clamp=0
; wide_light: 1 = light grids and line-of-sight tables for screens up to 2944x2760 (needed above 1024x768), 0 = the original
wide_light=1
; light_flicker: original = a new random brightness every frame (throbbing), gentle = eased (default), off = steady
light_flicker=gentle
; map_background: how dark the screen gets behind the map, 0 (clear) to 100 (black); default 25
map_background=25
; smooth camera: the view eases after the player instead of being locked to him (1 on, 0 off)
camera_smooth=1
; how slowly the view follows, in milliseconds
camera_ease_ms=120
; the player can move this far (part of the smaller screen side) before the view follows
camera_dead_zone=0.15
; the player never gets further than this from the centre (part of the screen size)
camera_max_lag=0.25
; ui_scale: the GUI (HUD, inventory, book, menus in the game) drawn bigger, the world stays at full resolution; 1 = off, e.g. 1.5 or 2.2;
; at most resolution / 640x480 (1920x1080: 2.25, 2560x1440: 3, 3840x2160: 4.5): a bigger value is lowered to that
ui_scale=1
; world zoom (numpad + / - / *, gamepad: hold R3 and push the right stick up / down): only the world, the GUI keeps its size
; edge smoothing: 0 off, 1 low, 2 medium, 3 high (also in the F7 menu)
; sprite_edges / wall_edges blend the outline with what is behind it; *_soften blur lightly inside
sprite_edges=0
sprite_soften=0
wall_edges=0
wall_soften=0
floor_soften=0
; zoom: at the start of a game (1 = none); zoom_max: how far in (1-4); zoom_step: numpad / R3 zoom step (0.1, 0.25...); zoom_ease_ms: smoothing of the steps
zoom=1
zoom_max=2
zoom_step=0.1
zoom_ease_ms=100
; frame_rate: 30 = the original; 60 / 90 / 120 draw extra pictures between the game's 30 ticks (also in the F7 menu)
frame_rate=30
; profile: N = for development only, looks where the game is every N ms and logs the busiest places every 10 s (0 off)
profile=0
; threads: helper threads for the world copy into the HUD layer, 0 = automatic (processors less one, at most 7)
threads=0
cursor_layer=1
gpu_convert=1

[save]
; rolling_autosave: 1 = every autosave keeps the previous two (AUTOSAV1, AUTOSAV2, shown in the save / load lists)
rolling_autosave=1

[game]
; ally_spells: spells that can be aimed (Lesser Heal, Haste, Shield...) go to your creature / another player under the cursor when aiming with the mouse or the right stick (1 on, 0 off: always on yourself)
ally_spells=1
; carry_weight: multiplies how much you can carry before you are slowed down: 1 (original), 1.25, 1.5, 2, 3, 5, 10
carry_weight=1
fix_shield_load=1
